# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  application:
    name: taco-cloud
  data:
    mongodb:
      auto-index-creation: true
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Kafka properties.
  kafka:
    bootstrap-servers:
    - localhost:9092
    template:
      default-topic: tacocloud.orders.topic
    producer:
      keySerializer: org.springframework.kafka.support.serializer.JsonSerializer
      valueSerializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
management:
#end::infoGitModeFull[]
#end::healthShowDetails[]
  endpoints:
    web:
      exposure:
        include: health,info
#end::exposeAll[]
#end::excludeSome[]
#tag::healthShowDetails[]
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

tacocloud:
  taco-of-day:
    zone: UTC
  favorites:
    max-page-size: 50
  taco-search:
    max-size: 50
  api:
    allowed-origins: ${TACOCLOUD_API_ALLOWED_ORIGINS:http://localhost:8080}
  order-pricing:
    currency: USD
    max-quantity: 10
  coupons:
    codes:
      CLASS10:
        type: PERCENTAGE
        value: 10.00
        starts-on: "2020-01-01"
        expires-on: "2035-12-31"
        minimum-subtotal: 10.00
        maximum-discount: 20.00
      WELCOME5:
        type: FIXED
        value: 5.00
        starts-on: "2020-01-01"
        expires-on: "2035-12-31"
        minimum-subtotal: 5.00

