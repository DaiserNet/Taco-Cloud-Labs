security:
  user:
    name: buzz
    password: infinity

taco:
  orders:
    pageSize: 10



#logging:
#  level:
#    org.springframework.data.rest: debug
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
spring:
# end::springBootAdminUri[]
# end::springBootAdminCreds[]
  application:
    name: taco-cloud
  data:
    mongodb:
      auto-index-creation: true
    rest:
      base-path: /data-api
    cassandra:
      keyspace-name: tacocloud
      schema-action: recreate
# tag::springBootAdminCreds[]
# tag::springBootAdminUri[]
  boot:
    admin:
      client:
        url: http://localhost:9090
# end::springBootAdminUri[]
        username: admin
        password: 53cr3t
# end::springBootAdminCreds[]

  artemis:
    mode: native
    host: ${TACOCLOUD_JMS_HOST:localhost}
    port: ${TACOCLOUD_JMS_PORT:61616}
    user: ${TACOCLOUD_JMS_USER:}
    password: ${TACOCLOUD_JMS_PASSWORD:}
    embedded:
      enabled: false
  rabbitmq:
    host: ${TACOCLOUD_RABBIT_HOST:localhost}
    port: ${TACOCLOUD_RABBIT_PORT:5672}
    username: ${TACOCLOUD_RABBIT_USER:}
    password: ${TACOCLOUD_RABBIT_PASSWORD:}
    dynamic: false
    publisher-confirm-type: simple
    publisher-returns: true
    template:
      mandatory: true
  kafka:
    bootstrap-servers: ${TACOCLOUD_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jmx:
    enabled: true

#tag::exposeAll[]
#tag::excludeSome[]
#tag::healthShowDetails[]
#tag::infoGitModeFull[]
management:
#end::infoGitModeFull[]
#end::healthShowDetails[]
  endpoints:
    web:
      exposure:
        include: health,info,metrics
#end::exposeAll[]
#end::excludeSome[]
#tag::healthShowDetails[]
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo,outbox
      show-details: when_authorized
      roles: ADMIN
#end::healthShowDetails[]
#tag::infoGitModeFull[]
  info:
    git:
      mode: full
#end::infoGitModeFull[]

#tag::contactInfo[]
info:
  contact:
    email: support@tacocloud.com
    phone: 822-625-6831
#end::contactInfo[]

tacocloud:
  outbox:
    batch-size: ${TACOCLOUD_OUTBOX_BATCH_SIZE:50}
    max-attempts: ${TACOCLOUD_OUTBOX_MAX_ATTEMPTS:10}
    backoff-ms: ${TACOCLOUD_OUTBOX_BACKOFF_MS:1000}
    max-backoff-ms: ${TACOCLOUD_OUTBOX_MAX_BACKOFF_MS:60000}
    lease-ms: ${TACOCLOUD_OUTBOX_LEASE_MS:60000}
    send-timeout-ms: ${TACOCLOUD_OUTBOX_SEND_TIMEOUT_MS:30000}
    poll-delay-ms: ${TACOCLOUD_OUTBOX_POLL_DELAY_MS:5000}
    health-max-age-ms: ${TACOCLOUD_OUTBOX_HEALTH_MAX_AGE_MS:60000}
  messaging:
    transport: ${TACOCLOUD_MESSAGING_TRANSPORT:noop}
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbitmq:
      destination: ${TACOCLOUD_RABBIT_DESTINATION:tacocloud.order.queue}
      confirm-timeout-ms: ${TACOCLOUD_RABBIT_CONFIRM_TIMEOUT_MS:30000}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  kitchen:
    eta:
      base-minutes: 4
      per-queued-order-minutes: 3
      per-unit-minutes: 2
      per-extra-ingredient-minutes: 1
  order-history:
    max-page-size: 50
  taco-of-day:
    zone: UTC
  favorites:
    max-page-size: 50
  ratings:
    min-votes: 2
    max-top-limit: 50
  taco-search:
    max-size: 50
  api:
    allowed-origins: ${TACOCLOUD_API_ALLOWED_ORIGINS:http://localhost:8080}
  order-pricing:
    currency: USD
    max-quantity: 10
  coupons:
    codes:
      CLASS10:
        type: PERCENTAGE
        value: 10.00
        starts-on: "2020-01-01"
        expires-on: "2035-12-31"
        minimum-subtotal: 10.00
        maximum-discount: 20.00
      WELCOME5:
        type: FIXED
        value: 5.00
        starts-on: "2020-01-01"
        expires-on: "2035-12-31"
        minimum-subtotal: 5.00

---
spring:
  profiles: prod

  data:
    mongodb:
      # Transactions require a replica set; configure TACOCLOUD_MONGODB_URI.
      uri: ${TACOCLOUD_MONGODB_URI}

  datasource:
    url: jdbc:mysql://localhost/tacocloud
    username: tacouser
    password: tacopassword

logging:
  level:
    tacos: WARN
