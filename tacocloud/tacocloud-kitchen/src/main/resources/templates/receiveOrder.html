<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Received Order</title>
    <link rel="stylesheet"
          th:href="@{/styles.css}"></link>
  </head>
  
  <body>
	<h2>Order <span th:text="${order.payload.orderId}">ORDER ID</span></h2>
	
	<h3>Tacos:</h3>
	<div th:each="taco : ${order.payload.items}">
	  <b th:text="${taco.tacoName}">TACO NAME</b>
	  <span th:text="${taco.quantity}">QUANTITY</span><br/>
	  <ul>
	  	<li th:each="ingredient : ${taco.ingredients}">
	  	  <span th:text="${ingredient.name}">INGREDIENT</span>
	  	</li>
	  </ul>
	</div>
	
	<p>Click the browser refresh to pull the next order.</p>
  </body>
</html>
