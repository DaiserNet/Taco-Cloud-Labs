server:
  port: 8081

spring:
  rabbitmq:
    host: ${TACOCLOUD_RABBIT_HOST:localhost}
    port: ${TACOCLOUD_RABBIT_PORT:5672}
    username: ${TACOCLOUD_RABBIT_USER:}
    password: ${TACOCLOUD_RABBIT_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
  data:
    mongodb:
      uri: ${TACOCLOUD_KITCHEN_MONGODB_URI:mongodb://localhost:27017/tacocloud?replicaSet=rs0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

tacocloud:
  messaging:
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbitmq:
      destination: ${TACOCLOUD_RABBIT_DESTINATION:tacocloud.order.queue}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  kitchen:
    consumer:
      max-retries: ${TACOCLOUD_KITCHEN_MAX_RETRIES:3}
      backoff-ms: ${TACOCLOUD_KITCHEN_BACKOFF_MS:1000}
      max-backoff-ms: ${TACOCLOUD_KITCHEN_MAX_BACKOFF_MS:30000}
      confirm-timeout-ms: ${TACOCLOUD_KITCHEN_CONFIRM_TIMEOUT_MS:30000}

---
spring:
  profiles: jms-template, jms-listener
  jms:
    template:
      receive-timeout: 2
  artemis:
    mode: native
    host: ${TACOCLOUD_JMS_HOST:localhost}
    port: ${TACOCLOUD_JMS_PORT:61616}
    user: ${TACOCLOUD_JMS_USER:}
    password: ${TACOCLOUD_JMS_PASSWORD:}
    embedded:
      enabled: false
    
---
spring:
  profiles: kafka-listener
    
  kafka:
    bootstrap-servers: ${TACOCLOUD_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: tacocloud_kitchen
      properties:
        spring.json.trusted.packages: tacos.messaging

      
      
      
      
